# Cloud Build 배포: 테스트 → 이미지 빌드 → Artifact Registry → Cloud Run
# 수동 실행: gcloud builds submit --config cloudbuild.yaml --project=acting-practice --region=asia-northeast3 .
# main 브랜치 푸시 트리거에서도 같은 파일을 씀
substitutions:
  _REGION: asia-northeast3
  _SERVICE: acting-practice
  _IMAGE: asia-northeast3-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/acting-practice
  _RUN_SA: acting-practice-run@${PROJECT_ID}.iam.gserviceaccount.com

steps:
  - id: test
    name: node:22-alpine
    entrypoint: node
    args: ['--test']

  - id: build
    name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}:${BUILD_ID}', '-t', '${_IMAGE}:latest', '.']

  - id: push
    name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_IMAGE}']

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${BUILD_ID}
      - --region=${_REGION}
      - --service-account=${_RUN_SA}
      - --allow-unauthenticated
      - --memory=256Mi
      - --max-instances=3
      - --concurrency=20   # 큰 대본 분석·음성 합성이 몰려도 256Mi 메모리를 넘지 않게
      # AI 배역 분석용 Claude 키 (Secret Manager 'anthropic-api-key'에 버전이 있어야 배포됨)
      - --set-secrets=ANTHROPIC_API_KEY=anthropic-api-key:latest
      - --quiet

  # 시험 배포(cloudbuild-staging.yaml, --no-traffic)를 한 뒤에는 손님이 예전 버전에 묶여 있으므로, 실제 배포는 항상 최신 버전으로 돌림
  - id: route-to-latest
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ['run', 'services', 'update-traffic', '${_SERVICE}', '--to-latest', '--region=${_REGION}', '--quiet']

serviceAccount: projects/${PROJECT_ID}/serviceAccounts/acting-practice-build@${PROJECT_ID}.iam.gserviceaccount.com
options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true   # _IMAGE·_RUN_SA 안의 ${PROJECT_ID}를 풀어 줌
timeout: 900s
